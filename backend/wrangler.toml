name = "velocity-launch"
main = "src/workers/generate.js"
compatibility_date = "2024-01-01"

[vars]
OPENROUTER_MODEL = "openai/gpt-5.6-luna"
APP_URL = "https://velocity.digitalblueskye.com"
NOTION_REDIRECT_URI = "https://velocity-launch.djelloulabid75.workers.dev/notion/callback"
NOTION_CLIENT_ID = "3bad872b-594c-8190-a3ee-003757d27b4d"
NOTION_COVER_URL = "https://velocity.digitalblueskye.com/assets/ai-images/lucid-origin_a_surreal_and_vibrant_cinematic_photo_of_Abstract_tech_hero_image_geometric_shap-0.jpg"
JIRA_REDIRECT_URI = "https://velocity-launch.djelloulabid75.workers.dev/jira/callback"
JIRA_CLIENT_ID = "dNq58ioA9irxzv6Xj8oxKOZ5VHlk0zvE"
GITHUB_REDIRECT_URI = "https://velocity-launch.djelloulabid75.workers.dev/github/callback"
# GITHUB_CLIENT_ID : à renseigner une fois l'OAuth App créée sur GitHub
# JIRA_CLIENT_SECRET : secret via `wrangler secret put JIRA_CLIENT_SECRET --name velocity-launch`
# NOTION_CLIENT_SECRET : secret via `wrangler secret put NOTION_CLIENT_SECRET --name velocity-launch`
# GITHUB_CLIENT_SECRET : secret via `wrangler secret put GITHUB_CLIENT_SECRET --name velocity-launch`

[[kv_namespaces]]
binding = "AI_USAGE"
id = "8cd92aa2a9fe4328a9d0482235c85123"

[[d1_databases]]
binding = "DB"
database_name = "velocity-launch-db"
database_id = "7a61b463-24c3-4687-8a37-d71e815ca787"

[[queues.producers]]
queue = "velocity-agent-tasks"
binding = "AGENT_TASKS_QUEUE"

[[queues.consumers]]
queue = "velocity-agent-tasks"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3

[env.production]
name = "velocity-launch-prod"

[env.development]
name = "velocity-launch-dev"
