name = "velocity-launch"
main = "src/workers/generate.js"
compatibility_date = "2024-01-01"

[vars]
OPENROUTER_MODEL = "openai/gpt-5.6-luna"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "8cd92aa2a9fe4328a9d0482235c85123"

[[d1_databases]]
binding = "DB"
database_name = "velocity-launch-db"
database_id = "7a61b463-24c3-4687-8a37-d71e815ca787"

[[queues.producers]]
queue = "velocity-agent-tasks"
binding = "AGENT_TASKS_QUEUE"

[[queues.consumers]]
queue = "velocity-agent-tasks"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3

[env.production]
name = "velocity-launch-prod"

[env.development]
name = "velocity-launch-dev"
