[build]
base = "frontend"
command = "npm run build"
publish = "dist"
# Chemin résolu relativement à base ("frontend") — le déploiement précédent (commit
# 93ab84d) avait le dossier à la racine du repo et Netlify ne l'a jamais détecté
# (available_functions: [], edge_functions_present: null côté API) : la config edge
# functions suit bien base, contrairement à ce qu'on pouvait supposer par analogie avec
# Cloudflare Pages Functions (qui, elles, ignorent la racine du monorepo).
edge_functions = "netlify/edge-functions"

# Injecte les meta og:image/og:title spécifiques à un plan pour les liens de partage
# (/s/:id) et les plans publics de la galerie (/p/:id) — voir frontend/netlify/edge-functions/.
[[edge_functions]]
path = "/s/*"
function = "og-share"

[[edge_functions]]
path = "/p/*"
function = "og-gallery"

# Fait passer l'image OG par le domaine principal plutôt que d'exposer l'URL brute
# *.workers.dev aux robots des réseaux sociaux : ce domaine générique très utilisé pour le
# spam/phishing est traité avec méfiance par certains crawlers (LinkedIn en particulier),
# qui ignorent silencieusement l'image au lieu de la refuser explicitement (constaté via
# Post Inspector : "No image found" malgré une image tout à fait valide en accès direct).
[[redirects]]
from = "/og/*"
to = "https://velocity-launch.djelloulabid75.workers.dev/og/:splat"
status = 200
force = true
