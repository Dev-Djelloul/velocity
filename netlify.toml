[build]
base = "frontend"
command = "npm run build"
publish = "dist"
# Chemin résolu relativement à base ("frontend") — le déploiement précédent (commit
# 93ab84d) avait le dossier à la racine du repo et Netlify ne l'a jamais détecté
# (available_functions: [], edge_functions_present: null côté API) : la config edge
# functions suit bien base, contrairement à ce qu'on pouvait supposer par analogie avec
# Cloudflare Pages Functions (qui, elles, ignorent la racine du monorepo).
edge_functions = "netlify/edge-functions"

# Injecte les meta og:image/og:title spécifiques à un plan pour les liens de partage
# (/s/:id) et les plans publics de la galerie (/p/:id) — voir frontend/netlify/edge-functions/.
[[edge_functions]]
path = "/s/*"
function = "og-share"

[[edge_functions]]
path = "/p/*"
function = "og-gallery"

# Le proxy /og/* -> le Worker (pour éviter d'exposer l'URL *.workers.dev brute aux robots
# des réseaux sociaux, voir plus haut) vit dans frontend/public/_redirects, PAS ici : dans
# ce projet, les règles de _redirects l'emportent en pratique sur celles déclarées dans ce
# fichier pour un même chemin, malgré la doc Netlify qui documente l'inverse — vérifié
# empiriquement (une règle [[redirects]] ici pour /og/* était silencieusement ignorée au
# profit du fallback SPA générique de _redirects).
